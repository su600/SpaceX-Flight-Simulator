server {
    listen 3000 default_server;
    listen [::]:3000 default_server;
    # 部署时替换为实际域名或 IP
    server_name _;
    root /var/www/spacex-flight-lab/current;
    index index.html;
    server_tokens off;

    access_log /var/log/nginx/spacex-flight-lab.access.log;
    error_log /var/log/nginx/spacex-flight-lab.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /flightlab-health {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"application":"SpaceX Flight Lab","version":"1.4.0","status":"ok"}';
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ /\. {
        deny all;
    }
}
